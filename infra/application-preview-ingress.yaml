AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudFront ingress proposal for odie-os application previews. Deploy only with
  an approved dedicated preview domain, and only
  in us-east-1 because CloudFront requires its ACM certificate there.

Parameters:
  PreviewIngressSecret:
    Type: String
    NoEcho: true
    MinLength: 64
    MaxLength: 64
    AllowedPattern: "^[0-9a-f]{64}$"
    ConstraintDescription: Must be exactly 64 lower-case hexadecimal characters.
    Description: >-
      Secret accepted by the sessions Worker in X-Odie-Preview-Ingress. Supply
      an approved value securely at deployment; never commit or output it.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront edge locations to use.
  PreviewDomain:
    Type: String
    AllowedPattern: '^(?!.*(?:^|[.])totango[.]com$)(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    ConstraintDescription: >-
      Must be a lower-case DNS apex with no wildcard and must not be totango.com
      or any of its descendants.
    Description: >-
      Security-approved dedicated registrable domain used only for untrusted
      previews. Its exact apex must be a verified public/private suffix.
  PreviewHostedZoneId:
    Type: String
    AllowedPattern: "^Z[A-Z0-9]+$"
    ConstraintDescription: Must be a Route53 hosted zone ID such as Z123EXAMPLE.
    Description: Route53 public hosted zone containing PreviewDomain.

Rules:
  RequireUsEast1:
    Assertions:
      - Assert: !Equals
          - !Ref AWS::Region
          - us-east-1
        AssertDescription: This stack must be deployed in us-east-1.

Resources:
  PreviewCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "*.${PreviewDomain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub "*.${PreviewDomain}"
          HostedZoneId: !Ref PreviewHostedZoneId
      Tags:
        - Key: service
          Value: odie-os-application-preview

  PreviewHostRouter:
    Type: AWS::CloudFront::Function
    Properties:
      Name: odie-os-application-preview-host-router
      AutoPublish: true
      FunctionConfig:
        Comment: Route a strict one-label preview hostname without logging it
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host.value.toLowerCase();
          var suffix = '.${PreviewDomain}';

          if (host.length <= suffix.length ||
              host.slice(host.length - suffix.length) !== suffix) {
            return invalidHost();
          }

          var label = host.slice(0, host.length - suffix.length);
          if (!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(label)) {
            return invalidHost();
          }

          request.headers['x-odie-preview-host'] = { value: host };
          request.uri = '/gatekeeper/sessions/application-preview/' + label + request.uri;
          return request;
        }

        function invalidHost() {
          return {
            statusCode: 400,
            statusDescription: 'Bad Request',
            headers: { 'cache-control': { value: 'no-store' } }
          };
        }

  PreviewDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: odie-os application preview ingress
        Aliases:
          - !Sub "*.${PreviewDomain}"
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: sessions-worker
            DomainName: odie-os-gk-sessions.odie-os.workers.dev
            ConnectionAttempts: 3
            ConnectionTimeout: 10
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 120
            OriginCustomHeaders:
              - HeaderName: X-Odie-Preview-Ingress
                HeaderValue: !Ref PreviewIngressSecret
        DefaultCacheBehavior:
          TargetOriginId: sessions-worker
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - DELETE
            - GET
            - HEAD
            - OPTIONS
            - PATCH
            - POST
            - PUT
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: false
          # AWS managed CachingDisabled. All TTLs are zero.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AWS managed AllViewerExceptHostHeader. This forwards every viewer
          # header, cookie, and query string while generating the origin Host.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PreviewHostRouter.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref PreviewCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        # Do not add request-level logging. Host and URI contain a bearer
        # capability. Use only aggregate CloudFront metrics.

  PreviewAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PreviewHostedZoneId
      Name: !Sub "*.${PreviewDomain}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt PreviewDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  PreviewAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PreviewHostedZoneId
      Name: !Sub "*.${PreviewDomain}."
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt PreviewDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  DistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref PreviewDistribution
  DistributionDomainName:
    Description: CloudFront-generated domain, for diagnostics only.
    Value: !GetAtt PreviewDistribution.DomainName
  CertificateArn:
    Description: ACM certificate ARN.
    Value: !Ref PreviewCertificate
  FunctionArn:
    Description: Published viewer-request Function ARN.
    Value: !GetAtt PreviewHostRouter.FunctionARN
  PreviewHostnamePattern:
    Description: One-label public preview hostname pattern.
    Value: !Sub "<label>.${PreviewDomain}"
