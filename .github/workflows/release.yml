name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22.14.0"
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build candidate
    if: >-
      github.repository == 'totango/odie-os' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Build immutable release
        env:
          GITHUB_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/release/build-release.mjs --out release-out

      - name: Derive release ID
        id: release
        run: echo "id=r$(printf '%06d' "$GITHUB_RUN_NUMBER")-${RELEASE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Store release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-out/
          if-no-files-found: error
          retention-days: 30

    outputs:
      release_id: ${{ steps.release.outputs.id }}

  promote:
    name: Promote to production
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://odie-os.odie-os.workers.dev/
    concurrency:
      group: production-release-promotion
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.run_number }}-${{ github.run_attempt }}
          path: release-out

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upload approved candidate
        env:
          R2_ENDPOINT: ${{ secrets.RELEASE_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.RELEASE_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.RELEASE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/release/upload-release.mjs --release release-out --candidate

      - name: Promote approved candidate
        env:
          R2_ENDPOINT: ${{ secrets.RELEASE_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.RELEASE_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.RELEASE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_R2_SECRET_ACCESS_KEY }}
        run: node scripts/release/promote-release.mjs --release-id "${{ needs.candidate.outputs.release_id }}"
