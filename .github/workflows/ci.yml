name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"

jobs:
  browser-continuity:
    name: Browser continuity (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true
      - name: Install Chromium and system dependencies
        run: pnpm --filter @gadgets/workshop-frontend exec playwright install --with-deps chromium
      - name: Run real-browser continuity regressions
        run: pnpm --filter @gadgets/workshop-frontend test:browser:continuity
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-continuity-failures
          path: packages/workshop-frontend/browser/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Parallel to `test` so lint and test failures surface on the same run. Package type checking
  # lives in Build; `scripts/` is checked here instead, because it is deliberately kept off
  # `pnpm build`'s hot path (see AGENTS.md) and this is the cheap job.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed.
      #
      # No `cache` here, unlike `test`: this job is fast anyway, and both caching
      # means they race to reserve the same lockfile-keyed entry.
      # TODO(someday): It would be great if the setup-vp action could share a cache key with the test job but disable writes to cache
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true

      - name: Lint
        run: pnpm lint:check

      - name: Type-check scripts/
        run: pnpm types:scripts

  test:
    name: Build and test
    runs-on: ubuntu-latest
    # Job-level backstop for installation/build as well as tests. Test commands have shorter
    # process-level deadlines below so a wedged runner reports a failure before cancellation.
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed.
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: true

      # Codegen, the frontend/SPA bundles, and the repo's single type check (`types:check` aliases this).
      - name: Build
        run: pnpm build

      # UI's synchronous jsdom menu tests pass alone but exceed the 60s silence budget
      # alongside workerd suites. Diagnose them independently, without widening that budget.
      - name: Test shared UI in isolation
        timeout-minutes: 3
        working-directory: packages/ui
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          timeout --verbose --kill-after=10s 150s
          pnpm exec gadgets-with-timeout --idle 60 --max 120 --
          vitest run --maxWorkers=1 --reporter=verbose

      # Keep the complete root test graph, including UI. One package task at a time
      # avoids multiplying Vitest/workerd fleets; the V8 heap cap is per Node process,
      # not a total RSS limit. Build retains its normal concurrency.
      # A package watchdog fired in run 36497593549 but vp never returned. Supervise
      # the root too, with GNU timeout as a backstop even if watchdog cleanup wedges.
      - name: Test
        timeout-minutes: 13
        env:
          VP_RUN_CONCURRENCY_LIMIT: "1"
          NODE_OPTIONS: --max-old-space-size=4096
        run: >-
          timeout --verbose --kill-after=10s 12m
          node scripts/with-timeout.ts --idle 120 --max 660 -- pnpm test

      - name: Test failure diagnostics
        if: failure()
        run: |
          free -m
          ps -eo pid,ppid,stat,pcpu,rss,comm --sort=-rss
          # Distinguish memory pressure from a live but stalled worker on the next failure.
          for file in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak; do
            if [ -r "$file" ]; then
              printf '\n%s\n' "$file"
              cat "$file"
            fi
          done
